name: Inaccuracy
description: A page says something that the official chapter does not say, or it omits something that the chapter says.
labels: [inaccuracy]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Give the link to the page on visualixir.blessing.id.
    validations:
      required: true
  - type: textarea
    id: says
    attributes:
      label: What the page says
      description: Quote the sentence or describe the diagram.
    validations:
      required: true
  - type: textarea
    id: official
    attributes:
      label: What the official docs say
      description: Quote the text. Give the link to the chapter on elixir.hexdocs.pm.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
