name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # what the pages say must be backed by the official chapters in upstream/ (stdlib python, no deps)
      - run: python3 scripts/audit.py
      # the .svg files are committed, so CI needs no Graphviz. A dead link fails the build.
      - run: pnpm run build:site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: check the output
        run: |
          for f in index.html 404.html favicon.svg og.png _headers; do test -f docs/.vitepress/dist/$f || { echo "missing $f"; exit 1; }; done
          if [ -n "${{ vars.SITE_URL }}" ]; then test -f docs/.vitepress/dist/sitemap.xml; fi
          echo "pages: $(find docs/.vitepress/dist -name '*.html' | wc -l)"
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: docs/.vitepress/dist
          retention-days: 1

  # The built site, in a real browser: every page loads and is well formed, the layout holds on a phone,
  # search finds things, and axe finds no accessibility violations (light and dark, desktop and phone).
  e2e:
    name: e2e · ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: site, layout, search
            tasks: site layout search
          - name: axe desktop
            tasks: axe
          - name: axe phone
            tasks: axe-phone
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: node e2e/run.mjs ${{ matrix.tasks }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}

  # The same pages in Firefox and WebKit (Safari's engine). Layout and search are where engines differ; axe is
  # not browser-specific, so it stays in Chromium above. Reports only, so it does not gate the deploy: make it
  # a requirement (add it to the deploy job's `needs`) once it has been green for a while.
  browsers:
    name: e2e · ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: docs/.vitepress/dist
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: node e2e/run.mjs site layout search
        env:
          BROWSER: ${{ matrix.browser }}
          SITE_URL: ${{ vars.SITE_URL }}

  # What passed the build and the e2e checks goes live; pull requests never deploy. Off until the repo variable
  # DEPLOY_CLOUDFLARE is "true" and the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist
  # (until then, deploy by hand: see README).
  deploy:
    name: deploy · cloudflare pages
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_CLOUDFLARE == 'true'
    runs-on: ubuntu-24.04
    concurrency: deploy
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist
      - run: npx --yes wrangler@4 pages deploy dist --project-name visualixir --branch main --commit-hash ${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
